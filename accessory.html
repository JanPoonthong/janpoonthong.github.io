<!doctype html>
<html>
  <head>
    <title>Car Accessories</title>
    <link rel="stylesheet" href="./css/global.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://code.jquery.com/jquery-3.6.0.min.js"
      integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <h1>Car Accessories</h1>

    <button
      type="button"
      class="btn btn-primary"
      data-bs-toggle="modal"
      data-bs-target="#exampleModal"
    >
      Add Item
    </button>

    <!-- Modal -->
    <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <label for="accessory">Select an accessory:</label>
              <select id="accessory" name="accessory">
                <option value="p123">Car Cover</option>
                <option value="p234">Seat Covers</option>
                <option value="p456">Floor Mats</option>
                <option value="p996">Door Visor</option>
                <!-- Add more options as needed -->
              </select>
              <br />
              <label for="amount">Amount:</label>
              <input
                type="number"
                id="amount"
                name="amount"
                min="1"
                value="1"
              />
              <br />
            </form>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Close
              </button>
              <button
                type="button"
                class="btn btn-primary"
                onclick="addToProductList()"
              >
                Save changes
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <h2>Product List</h2>

    <table id="productList">
      <thead>
        <tr>
          <th>Accessory</th>
          <th>Amount</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <p class="total">Gross Price: $<span id="totalPrice">0</span></p>
    <p id="vat">VAT:</p>
    <p id="netPrice">Net Price:</p>
    <!-- Button trigger modal -->

    <script>
      var quoationData = [];

      function addToProductList() {
        var accessory = $("#accessory").val();
        var accessoryName = $("#accessory").text();
        var amount = $("#amount").val();
        var price = calculatePrice(accessory) * amount;

        var table = $("#productList tbody");
        quoationData.push({
          accessory: accessory,
          amount: amount,
          price: price,
        });
        renderTable();
      }

      function renderTable() {
        var dataRows = quoationData.map((e, i) => {
          return `<tr class="data-row">
            <td>
                <button onclick="deleteItem(${i})">X</button>
                ${e.accessory}
            </td>
            <td>${e.amount}</td>
            <td>${e.price}</td>
            </tr>`;
        });

        $(".data-row").remove();

        dataRows.forEach((r) => {
          $("#productList tbody").before(r);
        });

        updateTotalPrice();
      }

      function deleteItem(i) {
        quoationData.splice(i, 1);
        renderTable();
      }

      function calculatePrice(accessory) {
        // Add your own logic to calculate the price based on the selected accessory
        switch (accessory) {
          case "p123":
            return 50;
          case "p234":
            return 30;
          case "p456":
            return 20;
          case "p996":
            return 40;
          // Add more cases as needed
          default:
            return 0;
        }
      }

      var totalPrice = 0;

      function updateTotalPrice(price) {
        var totalPriceElement = $("#totalPrice");
        var totalPrice = parseFloat(totalPriceElement.text());
        totalPrice = quoationData
          .map((item) => item.price)
          .reduce((partialSum, a) => partialSum + a, 0);
        console.log(totalPrice);
        totalPriceElement.text(totalPrice.toFixed(2));
        calcualteVAT(totalPrice);
      }

      function calcualteVAT(totalPrice) {
        var vatElement = $("#vat");
        var netPriceElement = $("#netPrice");
        var vatRate = 0.07;
        var vatAmount = (totalPrice * vatRate).toFixed(2);
        var netPrice = (parseFloat(totalPrice) + parseFloat(vatAmount)).toFixed(
          2
        );
        vatElement.text(`VAT: ${vatAmount}`);
        netPriceElement.text(`Net Price: ${netPrice}`);
      }
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://code.jquery.com/jquery-3.6.0.min.js"
      integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
      crossorigin="anonymous"
    ></script>
  </body>
</html>
